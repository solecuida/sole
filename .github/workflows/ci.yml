name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app exec biome ci .
      - run: pnpm -C app typecheck
      - run: pnpm -C app db:start
      - run: pnpm -C app env:local
      - run: pnpm -C app db:test
      - run: pnpm -C app test

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app exec playwright install --with-deps chromium webkit
      - run: pnpm -C app db:start
      - run: pnpm -C app env:local
      - run: pnpm -C app test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # En un pull request la acción lee la lista de sus commits por la API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Los repos de una organización necesitan una licencia gratuita de gitleaks-action.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm -C app audit --prod --audit-level high

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/typescript --config p/react --config p/secrets --error app/src
