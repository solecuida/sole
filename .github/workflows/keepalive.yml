name: keepalive

# Supabase pausa los proyectos gratuitos sin actividad. La ruta de salud
# toca la base, así que una visita diaria mantiene el proyecto despierto.
on:
  schedule:
    - cron: "0 12 * * *" # UTC
  workflow_dispatch:

permissions: {}

jobs:
  salud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir la ruta de salud
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 30 https://app.solecuida.com/api/health
